<!DOCTYPE html>

  <title>Responsive Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    /* Dropdown on hover only for large screens */
    @media (min-width: 992px) {
      .navbar-nav .dropdown:hover .dropdown-menu {
        display: block;
        margin-top: 0;
      }
    }

    /* Remove focus outline on nav links (optional for aesthetics) */
    .nav-link:focus {
      box-shadow: none;
    }
  </style>


  <nav class="navbar navbar-expand-lg"
       style="background-color: #f0f5ff; padding: 1rem 2rem; z-index: 1000;">
    <div class="container-fluid">

      <!-- Logo -->
      <a class="navbar-brand" href="/home"
         style="font-weight: bold; font-size: 1.25rem; display: flex; align-items: center; gap: 8px; color: #000;">
        <img src="/files/logobbb677.webp" alt="Logo" width="170" height="50">
      </a>

      <!-- Hamburger Toggle Button -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
              aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Collapsible Navbar Content -->
      <div class="collapse navbar-collapse" id="navbarContent">

        <!-- Centered Links -->
        <ul class="navbar-nav mx-lg-auto d-flex flex-lg-row flex-column align-items-lg-center gap-lg-4 mt-3 mt-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="/home" style="font-weight: 500; color: #000;font-size: 1.25rem;">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/about-us" style="font-weight: 500; color: #000;font-size: 1.25rem;">About Us</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="insightsDropdown" role="button"
               data-bs-toggle="dropdown" aria-expanded="false"
               style="font-weight: 500; color: #000;font-size: 1.25rem;">
              Insights
            </a>
            <ul class="dropdown-menu"
                aria-labelledby="insightsDropdown"
                style="background-color: #f0f5ff; padding: 10px; border-radius: 12px;
                       box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); border: none; min-width: 180px;">
              <li>
                <a class="dropdown-item" href="/videos"
                   style="padding: 10px 16px; border-radius: 8px; transition: background 0.2s; font-weight: 500;font-size: 1.25rem;">
                  Videos
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="/blogs"
                   style="padding: 10px 16px; border-radius: 8px; transition: background 0.2s; font-weight: 500;font-size: 1.25rem;">
                  Blogs
                </a>
              </li>
            </ul>
          </li>
          <!--<li class="nav-item">-->
          <!--  <a class="nav-link" href="/careers" style="font-weight: 500; color: #000;">Careers</a>-->
          <!--</li>-->
        </ul>

        <!-- Right-aligned Contact Us Button -->
        <div class="d-flex justify-content-lg-end mt-3 mt-lg-0">
          <a href="/contact"
             class="btn"
             style="background-color: #0b004b; color: white; font-size: 1.25rem; font-weight: 600; border: none;
                    padding: 6px 18px; border-radius: 8px; transition: background-color 0.3s;">
            Contact Us
          </a>
        </div>

      </div>
    </div>
  </nav>
